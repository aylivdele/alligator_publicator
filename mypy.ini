[mypy]
ignore_missing_imports = True

# Legacy SQLAlchemy Column() descriptors generate many false-positive assignment
# and var-annotated errors that are not real bugs. Suppress them per-module.
# To migrate away from these suppressions, convert Column() to mapped_column()
# with Mapped[] annotations (SQLAlchemy 2.0 style).

[mypy-app.domain.models]
disable_error_code = var-annotated, assignment

[mypy-app.worker]
disable_error_code = assignment

[mypy-app.application.services.publish_task]
disable_error_code = assignment, arg-type

[mypy-app.api.routes.tasks]
disable_error_code = assignment

[mypy-app.api.routes.admin]
disable_error_code = assignment

[mypy-app.infrastructure.instagram.graph_api_client]
disable_error_code = assignment, arg-type

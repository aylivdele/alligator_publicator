server {
    listen 80;
    server_name alligator.meta-box.ru admin.alligator.meta-box.ru;

    return 301 https://$host$request_uri;
}

# ===== Main app =====
server {
    listen 443 ssl;
    server_name alligator.meta-box.ru;

    ssl_certificate /etc/letsencrypt/live/alligator.meta-box.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alligator.meta-box.ru/privkey.pem;

    client_max_body_size 200M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
    }

    # ===== MINIO API =====
    location /s3/ {
        rewrite ^/s3/(.*)$ /$1 break;

        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /web-console {
        rewrite ^/s3/console/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:9001;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# ===== Admin subdomain =====
server {
    listen 443 ssl;
    server_name admin.alligator.meta-box.ru;

    # Uses the same cert (wildcard or SAN cert required for admin subdomain)
    # Run: certbot --nginx -d alligator.meta-box.ru -d admin.alligator.meta-box.ru
    ssl_certificate /etc/letsencrypt/live/alligator.meta-box.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alligator.meta-box.ru/privkey.pem;

    client_max_body_size 200M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
    }
}
